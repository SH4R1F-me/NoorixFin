name: mobile-e2e-ios
on:
  pull_request:
    branches: ['main']
jobs:
  build_ios:
    type: build
    params:
      platform: ios
      profile: e2e-test
  maestro_ios:
    needs: [build_ios]
    type: maestro
    environment: preview
    runs_on: macos-medium
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      flow_path:
        - .maestro/launch.yaml
        - .maestro/offline-relaunch.yaml
