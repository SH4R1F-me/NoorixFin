name: Release provenance

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '11.18.0'

jobs:
  release-artifacts:
    name: Attested release archive and SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Build immutable source release archive
        run: |
          mkdir -p dist
          git archive --format=tar.gz \
            --prefix="noorixfin-${GITHUB_SHA}/" \
            --output="dist/noorixfin-${GITHUB_SHA}.tar.gz" \
            "${GITHUB_SHA}"

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: dist/noorixfin-${{ github.sha }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate checksums
        run: sha256sum dist/*.tar.gz dist/*.spdx.json > dist/SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/noorixfin-${{ github.sha }}.tar.gz

      - name: Attest SPDX SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/noorixfin-${{ github.sha }}.tar.gz
          sbom-path: dist/noorixfin-${{ github.sha }}.spdx.json

      - name: Upload checksummed release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: noorixfin-${{ github.sha }}
          path: |
            dist/noorixfin-${{ github.sha }}.tar.gz
            dist/noorixfin-${{ github.sha }}.spdx.json
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 90
