name: CI

# ── WHY THIS EXISTS ──────────────────────────────────────────────────────────
# Audit item 13: "CI pipeline — none exists. All the tests exist; nothing runs
# them automatically."
#
# Everything below already ran locally, by hand, when someone remembered. That
# is how this repository accumulated the class of bug it keeps re-discovering:
# migrations that had never been applied from scratch, an E2E suite that only
# passed against one hand-made login, locale catalogs that had drifted. Each was
# found by a human running something they did not have to run.
#
# ── THE GATES, AND WHY EACH ONE IS HERE ──────────────────────────────────────
#   typecheck      — the cheapest gate, and since the schema types landed it
#                    catches wrong-column and wrong-constraint bugs too.
#   lint           — 0 errors is the enforced state, not an aspiration.
#   unit           — money arithmetic and the guards.
#   migrations     — FROM SCRATCH. A migration that only works against a
#                    developer's already-migrated database is the failure mode
#                    00008/00009/00014 each shipped.
#   db types fresh — a generated types file that has drifted is worse than none,
#                    because the compiler keeps vouching for a shape the
#                    database stopped having.
#   locale parity  — a key present in one language renders as its own name for
#                    half the users.
#   sql acceptance — RLS and the ledger invariants, as `authenticated`.
#   e2e            — against a production build, with a real API and database.
#
# Jobs are split so a failure names itself. One "test" job that runs everything
# reports "test failed", and someone has to open the log to learn whether the
# database or the browser broke.

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
    branches: [main]

# A second push supersedes the first. Two runs of the E2E suite against the same
# branch are two Supabase stacks competing for the same ports.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '11.18.0'
  API_URL: 'http://localhost:8080'
  # The published Supabase local default. Not a secret — it is in every
  # Supabase quickstart, and RLS is what protects the data.
  LOCAL_ANON_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0'

jobs:
  mobile:
    name: Mobile bundle gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck and sync-engine tests
        run: |
          pnpm --filter @noorixfin/mobile typecheck
          pnpm --filter @noorixfin/mobile test -- --runInBand

      # A native store build needs Apple/Google credentials, but this export
      # still resolves every route and bundles both platforms. It catches the
      # missing-native-module and broken-import failures that TypeScript cannot.
      - name: Bundle Android and iOS application code
        run: pnpm --filter @noorixfin/mobile exec expo export --platform all --output-dir /tmp/noorixfin-mobile-dist

  # ───────────────────────────────────────────────────────────────────────────
  static:
    name: Typecheck, lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Locale parity (bn ↔ en)
        run: pnpm --filter @noorixfin/i18n check:keys

      - name: Typecheck
        run: pnpm typecheck

      # Needs neither a database nor a running API: the OpenAPI document is
      # built by walking the Nest module graph, so this belongs in the fast
      # job rather than behind `supabase start`. Catches a route added without
      # regenerating the client types, which would otherwise typecheck green
      # against a shape the server stopped serving.
      - name: API client types match the API
        run: pnpm --filter @noorixfin/api-client check:fresh

      # tokens.css is generated but committed (turbo dev does not run build, and
      # a fresh clone would otherwise start unstyled). Committed means it can go
      # stale; this is what stops it.
      - name: Design tokens match tokens.css
        run: pnpm --filter @noorixfin/design-tokens check:fresh

      # `--max-warnings 0`. The count is zero today, and letting warnings
      # accumulate is exactly how 289 lint errors became the normal state.
      - name: Lint (API)
        run: pnpm --filter @noorixfin/api exec eslint src --max-warnings 0

      - name: Lint (web)
        run: pnpm --filter @noorixfin/web exec eslint src --max-warnings 0

      - name: Unit tests
        run: pnpm test

      # Stories are the only coverage several component states have, and a
      # story that no longer compiles is a state nobody is looking at any more.
      # Cheap: it is a Vite build of one package.
      - name: Storybook builds
        run: pnpm --filter @noorixfin/ui build-storybook -o /tmp/storybook

      - name: Production build
        run: pnpm build

  # ───────────────────────────────────────────────────────────────────────────
  database:
    name: Migrations from scratch, types and SQL acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # `db reset` applies every migration to an EMPTY database. That is the
      # whole point of this job: a migration that depends on state a developer
      # happens to have is one that fails on the first real deployment.
      - name: Start Supabase (applies all migrations from scratch)
        run: supabase start

      # `supabase start` cannot apply a migration it does not recognise, and it
      # says nothing when it skips one. This asserts that every .sql file in
      # supabase/migrations is a migration the CLI knows about AND has run —
      # so a mis-named or duplicate-versioned file fails here rather than
      # becoming a table that is missing in production only.
      # --strict because a CI database is created empty seconds earlier: an
      # applied migration with no file cannot be a branch artefact here.
      - name: No migration drift
        run: pnpm db:check-drift:strict

      - name: Generated types match the migrations
        run: pnpm --filter @noorixfin/db-types check:fresh

      - name: Seed the acceptance fixture
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 -q -f supabase/tests/_seed.sql

      # The GATE. `acceptance.sql` prints counts for a human and exits 0
      # whatever they say, so running it alone would be a green tick proving
      # only that psql ran. Every check in ci-assertions.sql RAISES, so a
      # regression exits non-zero. Verified by breaking each invariant on
      # purpose and confirming the exit code changed.
      - name: SQL invariants (tenant isolation, ledger, idempotency)
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 -f supabase/tests/ci-assertions.sql

      # Not a gate — kept because the printed counts are what a human reads
      # when the gate above fails and they need to see the shape of it.
      - name: SQL acceptance report (informational)
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -f supabase/tests/acceptance.sql

      # BACKUP-01. The runbook existed for months and nothing executed it —
      # a backup nobody has restored is a hypothesis, and the moment you find
      # out is the incident. This dumps the seeded database, restores it into a
      # second one, and re-runs the invariants plus row-for-row comparisons
      # against the restored copy. It never writes to the source.
      - name: Backup restore drill
        run: pnpm db:restore-drill

      - name: Stop Supabase
        if: always()
        run: supabase stop

  # ───────────────────────────────────────────────────────────────────────────
  e2e:
    name: End-to-end (real API, real database, production build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase
        run: supabase start

      - name: Build
        run: pnpm build

      # Local demo keys. Not secrets — they are the published Supabase local
      # defaults, and RLS is what protects the data (see apps/web/.env.local).
      - name: Write environment
        run: |
          cat > apps/api/.env.local <<'ENV'
          SUPABASE_URL=http://127.0.0.1:54321
          SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
          SUPABASE_SERVICE_ROLE_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
          SUPABASE_JWT_SECRET=super-secret-jwt-token-with-at-least-32-characters-long
          API_PORT=8080
          CORS_ORIGINS=http://127.0.0.1:3100
          NODE_ENV=test
          ENV
          cat > apps/web/.env.local <<'ENV'
          NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
          NEXT_PUBLIC_API_URL=${{ env.API_URL }}
          NEXT_PUBLIC_SITE_URL=http://127.0.0.1:3100
          NEXT_PUBLIC_GOOGLE_AUTH_ENABLED=false
          ENV

      # From inside apps/api, not the repo root. `envFilePath: ['.env.local']`
      # is resolved against process.cwd(), so starting it from the root means
      # the config is never read and the process dies on the first getOrThrow.
      - name: Start the API
        working-directory: apps/api
        run: |
          node dist/main.js &
          # Poll rather than sleep: a fixed wait is either flaky or slow, and on
          # a cold runner it is usually both.
          for i in $(seq 1 30); do
            curl -sf "${API_URL}/v1/health" > /dev/null && break
            sleep 1
          done
          curl -sf "${API_URL}/v1/health"

      - name: API application boundary tests
        run: pnpm --filter @noorixfin/api test:e2e
        env:
          E2E_API_URL: ${{ env.API_URL }}

      - name: Install Playwright browser
        run: pnpm --filter @noorixfin/web exec playwright install --with-deps chromium

      # E2E_LIVE=1 turns on the specs that seed their own accounts through the
      # real API. Without it they skip, and a green run would mean nothing.
      - name: E2E
        run: pnpm --filter @noorixfin/web test:e2e
        env:
          E2E_LIVE: '1'
          E2E_API_URL: ${{ env.API_URL }}

      # ── The API-DOWN half of the resilience suite ─────────────────────────
      # Audit finding C was that a REFUSED CONNECTION took every dashboard
      # route down with a 500, while an HTTP error degraded gracefully. That
      # can only be tested with nothing listening, so it cannot share a run
      # with the specs above — and while it could not, it never ran at all.
      #
      # The account is created BEFORE the API stops, because afterwards there
      # is nothing left to create it with.
      - name: Create an account for the degraded-mode run
        id: degraded-account
        run: |
          EMAIL="ci-degraded-$(date +%s)@noorixfin.test"
          curl -sf -X POST "http://127.0.0.1:54321/auth/v1/signup" \
            -H "apikey: ${{ env.LOCAL_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"$EMAIL\",\"password\":\"E2E-Password-1234\"}" > /dev/null
          echo "email=$EMAIL" >> "$GITHUB_OUTPUT"

      - name: Stop the API
        run: |
          pkill -f 'node dist/main.js' || true
          # Confirm it is actually gone. A test asserting "graceful with the API
          # down" that runs against a live API passes for the wrong reason.
          sleep 2
          if curl -sf --max-time 2 "${API_URL}/v1/health" > /dev/null; then
            echo "API is still up — the degraded run would prove nothing"; exit 1
          fi

      - name: E2E (degraded — API unreachable)
        run: pnpm --filter @noorixfin/web exec playwright test resilience
        env:
          E2E_API_DOWN: '1'
          E2E_ACCOUNT: ${{ steps.degraded-account.outputs.email }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/test-results/
          retention-days: 7

      - name: Stop Supabase
        if: always()
        run: supabase stop
